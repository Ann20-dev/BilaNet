# Render Blueprint for the BilaNet backend (FastAPI).
# Deploy: Render dashboard → New → Blueprint → select this repo.
services:
  - type: web
    name: bilanet-api
    runtime: python
    plan: free
    rootDir: bilanet/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # The free plan (512 MB RAM) cannot load the 2 GB local model, so the
      # online demo uses a hosted OpenAI-compatible API (Groq by default).
      # The desktop app is unaffected and stays fully offline (AI_PROVIDER=local).
      - key: AI_PROVIDER
        value: api
      - key: AI_API_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: AI_MODEL
        value: qwen/qwen3.8-27b
      # Secret: your Groq API key from https://console.groq.com/keys
      - key: AI_API_KEY
        sync: false
      # Your Vercel URL(s), comma-separated, e.g. https://bilanet.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # Optional: allow Vercel preview deployments too
      - key: CORS_ORIGIN_REGEX
        value: https://bila-?net.*\.vercel\.app
